[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anychain-transaction-assistant"
version = "0.1.0"
description = "Evidence-driven EVM transaction analysis"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
  "eth-abi>=5.2,<6",
  "eth-hash[pycryptodome]>=0.7,<1",
  "google-genai>=2.20,<3",
  "openai>=2.50,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

