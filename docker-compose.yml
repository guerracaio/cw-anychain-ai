services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      # Network profiles edited from the UI (may contain secrets; stays on this machine).
      - profiles:/app/config/local
    # Not published: the browser only talks to the frontend, which proxies /api/*.
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  profiles:
